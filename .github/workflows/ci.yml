name: CI

# Run on every PR, and on direct pushes to main (e.g. after a merge).
on:
  pull_request:
  push:
    branches: [main]

# If you push again before a run finishes, cancel the older run for the same
# branch — no point spending minutes testing a commit you've already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm # cache ~/.npm between runs for faster installs

      # `npm ci` installs exactly what's in package-lock.json — reproducible,
      # and fails if package.json and the lockfile are out of sync.
      - name: Install dependencies
        run: npm ci

      # Pre-commit hooks format locally, but they can be bypassed — so CI is
      # the authoritative check that everything is actually formatted.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Runs the suite with coverage; the thresholds in vite.config.ts make this
      # fail if coverage regresses below the configured floor.
      - name: Run tests with coverage
        run: npm run test:coverage

      # `npm run build` is `tsc -b && vite build`, so this also type-checks.
      - name: Build
        run: npm run build
